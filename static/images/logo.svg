<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E122D"/>
      <stop offset="50%" stop-color="#15173B"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="28" y="28" width="456" height="456" rx="110" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5"/>

  <!-- Radial Soft Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#centerGlow)"/>

  <!-- Left Echo Waves (Calm Cyan/Blue) -->
  <g stroke="url(#cyanGrad)" stroke-linecap="round" fill="none">
    <path d="M 125 105 A 190 190 0 0 0 125 407" stroke-width="14" opacity="0.4"/>
    <path d="M 155 135 A 150 150 0 0 0 155 377" stroke-width="18" opacity="0.7"/>
    <path d="M 188 170 A 110 110 0 0 0 188 342" stroke-width="22" opacity="0.9"/>
    <path d="M 220 205 A 65 65 0 0 0 220 307" stroke-width="26"/>
  </g>

  <!-- Right Echo Waves (Warm Empathy Rose/Violet) -->
  <g stroke="url(#roseGrad)" stroke-linecap="round" fill="none">
    <path d="M 387 105 A 190 190 0 0 1 387 407" stroke-width="14" opacity="0.4"/>
    <path d="M 357 135 A 150 150 0 0 1 357 377" stroke-width="18" opacity="0.7"/>
    <path d="M 324 170 A 110 110 0 0 1 324 342" stroke-width="22" opacity="0.9"/>
    <path d="M 292 205 A 65 65 0 0 1 292 307" stroke-width="26"/>
  </g>

  <!-- Central Resonance Axis -->
  <line x1="256" y1="150" x2="256" y2="362" stroke="#A5B4FC" stroke-width="20" stroke-linecap="round"/>

  <!-- Center Core Aura & Spheres -->
  <circle cx="256" cy="256" r="38" fill="#1E1B4B" stroke="#818CF8" stroke-width="14"/>
  <circle cx="256" cy="256" r="24" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="14" fill="#6366F1"/>
  <circle cx="256" cy="256" r="6" fill="#FFFFFF"/>

  <!-- Top Clarity Node -->
  <circle cx="256" cy="195" r="12" fill="#38BDF8"/>

  <!-- Bottom Grounding Node -->
  <circle cx="256" cy="317" r="12" fill="#F472B6"/>
</svg>
